name: 'Submission checker'
description: 'Checks that a <student_id>.jar is well-formed, contains its source code and runs within the limits on an assignment''s public tests.'

inputs:
  assignment:
    description: 'Assignment id = a folder under assignments/ (e.g. triangle)'
    required: true
  jar-path:
    description: 'Path of the jar to check, relative to the repository root (e.g. submissions/20240001.jar). Leave empty to use the single jar found in submissions-dir.'
    required: false
    default: ''
  submissions-dir:
    description: 'Used only when jar-path is empty: folder that contains exactly one <student_id>.jar'
    required: false
    default: 'submissions'

runs:
  using: composite
  steps:
    - name: Read assignment settings
      id: cfg
      shell: bash
      env:
        ASSIGNMENT: ${{ inputs.assignment }}
      run: python3 "${{ github.action_path }}/core/check_submission.py" --assignment "$ASSIGNMENT" --print-java-version >> "$GITHUB_OUTPUT"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ steps.cfg.outputs.java_version }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check submission
      shell: bash
      env:                       # user-supplied values go through env vars, never straight into the script
        ASSIGNMENT: ${{ inputs.assignment }}
        JAR_PATH: ${{ inputs.jar-path }}
        SUBMISSIONS_DIR: ${{ inputs.submissions-dir }}
      run: |
        args=(--assignment "$ASSIGNMENT")
        if [ -n "$JAR_PATH" ]; then args+=(--jar "$JAR_PATH"); else args+=(--submissions "$SUBMISSIONS_DIR"); fi
        python "${{ github.action_path }}/core/check_submission.py" "${args[@]}"
